[package]
name = "bz"
version = "0.1.0"
edition = "2021"
description = "A multi-agent coordination TUI"
license = "MIT"

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# PTY and terminal emulation
portable-pty = "0.9"
vt100 = "0.16"

# Error handling
color-eyre = "0.6"

# Session persistence
bincode = "1.3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tempfile = "3"
chrono = "0.4"

# Matrix client (rustls to avoid openssl, bundled-sqlite to avoid system sqlite)
matrix-sdk = { version = "0.7", default-features = false, features = ["e2e-encryption", "bundled-sqlite", "rustls-tls"] }

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[[bin]]
name = "bz"
path = "src/main.rs"

[[bin]]
name = "bzd"
path = "src/bin/bzd.rs"

[[bin]]
name = "bzc"
path = "src/bin/bzc.rs"

[[bin]]
name = "bz-pty-driver"
path = "src/bin/bz-pty-driver.rs"

[profile.release]
strip = true
lto = "thin"
